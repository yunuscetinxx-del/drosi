name: drosi_mobile
description: تطبيق دروسي — متصل بموقع دروسي (Next.js API)
publish_to: 'none'
version: 1.5.0+6

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  google_fonts: ^6.2.1
  package_info_plus: ^8.3.0
  ota_update: ^7.0.2
  flutter_html: ^3.0.0
  html_editor_enhanced: ^2.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: assets/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
